<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f6f2">
    <title>A Simple Page</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
        color: #24312d;
        background: #f3f6f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background-image: radial-gradient(#c9d5ca 0.7px, transparent 0.7px);
        background-size: 18px 18px;
      }

      main {
        width: min(100%, 680px);
        padding: clamp(28px, 7vw, 64px);
        border: 1px solid #dce5dc;
        border-radius: 8px;
        background: #fffefa;
        box-shadow: 0 18px 50px rgb(36 49 45 / 8%);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #477563;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 10ch;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        font-weight: 400;
        line-height: 1.02;
      }

      .intro {
        max-width: 42ch;
        margin: 24px 0 0;
        color: #58645e;
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .rule {
        width: 56px;
        height: 3px;
        margin-top: 36px;
        border: 0;
        background: #e18762;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">A small beginning</p>
      <h1>A simple page, with room to grow.</h1>
      <p class="intro">This is a clean starting point for your next idea. Add your content here and make it your own.</p>
      <hr class="rule">
    </main>
  </body>
</html>
